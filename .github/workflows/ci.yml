# Checks every part of the repo that can be checked without a backend:
#   schema       every golden fixture is a valid trace
#   cpp-linux    the C++ adapter with libstdc++ (GCC and Clang)
#   cpp-libcxx   the C++ adapter with libc++ (Apple Clang on macOS)
#   python-adapter
#                the Python adapter's tests (Python 3.12, as in its sandbox
#                image): every Python fixture equals its golden trace and is
#                like the C++ one
#   java-adapter
#                the Java adapter built and tested (JDK 21, as in its sandbox
#                image): every Java fixture equals its golden trace and is like
#                the C++ one, call by call
#   rewriter-linux, rewriter-macos
#                the rewriter's tests and the pipeline's, on each platform
#   sandbox-linux
#                both sandbox images, every isolation test under Docker and
#                under gVisor (docs/sandboxing.md), and the API service's
#                tests, with real runs under gVisor (docs/backend.md)
#   frontend     the sandbox page's tests and production build
#
# On a push to main, once the jobs above pass (the macOS ones aside), two more
# publish what was tested:
#   images       the three sandbox images, to the GitHub container registry
#                (ghcr.io/<owner>/visi-sandbox-cpp, -python, -java), tagged
#                latest and with the commit
#   pages        the frontend, built and deployed to GitHub Pages. The API's
#                address comes from the repository variable VISI_API_BASE
#                (Settings > Secrets and variables > Actions > Variables), so it
#                is not written in the repo; frontend/src/api/client.ts reads it
#                as VITE_API_BASE
#
# The C++ jobs run the same targets a contributor runs locally:
# `make -C adapters/cpp both header e2e` (see adapters/cpp/Makefile).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate every golden fixture
        run: python3 -I tools/check_trace.py fixtures/*.trace.json

  cpp-linux:
    # Pinned rather than ubuntu-latest, so the compilers below cannot change
    # under us when the label moves. Ubuntu 24.04 ships GCC 12, 13 and 14
    # and Clang 16, 17 and 18 (actions/runner-images, Ubuntu2404-Readme.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      # `make both` runs plain `clang++` and `g++`, so pick their versions by
      # putting links first on PATH. GCC 14 has the most complete <format>
      # in libstdc++. Clang uses libstdc++ too, from the newest GCC installed.
      - name: Choose g++-14 and clang++-18
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(command -v g++-14)" "$RUNNER_TEMP/bin/g++"
          ln -s "$(command -v clang++-18)" "$RUNNER_TEMP/bin/clang++"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Compiler versions
        run: |
          g++ --version
          clang++ --version
          clang++ -v -x c++ -E /dev/null 2>&1 | grep -m1 "Selected GCC installation" || true
      - name: Tests (clang++ and g++), header check, end-to-end
        run: make -C adapters/cpp both header e2e
      # The driver's tests compile the programs it generates, so they run
      # once per compiler.
      - name: Driver (clang++)
        run: CXX=clang++ python3 -m unittest discover -s driver/tests -t .
      - name: Driver (g++)
        run: CXX=g++ python3 -m unittest discover -s driver/tests -t .

  cpp-libcxx:
    # macOS 26 on arm64 (what macos-latest points to now). Its clang++ is
    # Apple Clang with libc++.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Compiler version
        run: clang++ --version
      # Not `make both`: on macOS g++ is the same Apple Clang, so it would only
      # run the same build twice.
      - name: Tests, header check, end-to-end
        run: make -C adapters/cpp test header e2e
      # libc++ has no <bits/stdc++.h>, which is why the prelude names each
      # header. This is where a missing one would show.
      - name: Driver (Apple Clang, libc++)
        run: CXX=clang++ python3 -m unittest discover -s driver/tests -t .

  python-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # sortedcontainers is in the Python sandbox image (sandbox/python.Dockerfile).
      - run: python -m pip install jsonschema sortedcontainers==2.4.0
      - name: Python adapter (every fixture, outcomes, kinds, limits)
        run: python3 -m unittest discover -s adapters/python/tests -v

  java-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install jsonschema
      - name: Build the Java adapter
        run: make -C adapters/java
      - name: Java adapter (every fixture, kinds, outcomes, limits)
        run: python3 -m unittest discover -s adapters/java/tests -v
      - name: Every fixture's twins, call by call
        run: python3 tools/compare_traces.py --all --core

  rewriter-linux:
    # The rewriter links against Clang 18's libraries. Ubuntu 24.04 ships
    # clang 18; its development headers and libclang-cpp come from apt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Install Clang 18 development files
        run: sudo apt-get update && sudo apt-get install -y libclang-18-dev libclang-cpp18-dev llvm-18-dev
      - name: Build the rewriter and run its tests (every golden fixture from its plain source)
        run: make -C adapters/cpp/rewriter test LLVM_CONFIG=llvm-config-18 CXX=g++-14
      - name: Pipeline (python3 -m pipeline, from Solution to validated trace)
        run: CXX=g++-14 python3 -m unittest discover -s pipeline/tests -t . -v

  rewriter-macos:
    # The author's platform: Homebrew's LLVM, Apple's SDK for the headers.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - run: brew install llvm
      - name: Build the rewriter and run its tests
        run: make -C adapters/cpp/rewriter test LLVM_CONFIG="$(brew --prefix llvm)/bin/llvm-config"
      - name: Pipeline (python3 -m pipeline, from Solution to validated trace)
        run: CXX=clang++ python3 -m unittest discover -s pipeline/tests -t . -v

  sandbox-linux:
    # The sandbox images and their isolation tests (pipeline/tests/test_sandbox.py),
    # first under Docker's own runtime, then under gVisor's runsc, which is what
    # the backend will use. The runner has Docker; gVisor is installed as its
    # install guide says (gvisor.dev/docs/user_guide/install).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Install gVisor and register runsc with Docker
        run: |
          cd "$RUNNER_TEMP"
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/$(uname -m)
          curl -fsSLO "$URL/gvisor.tar.bz2"
          curl -fsSLO "$URL/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker run --rm --runtime=runsc ubuntu:24.04 dmesg
      - name: Build the sandbox images
        run: |
          docker build -f sandbox/cpp.Dockerfile -t visi-sandbox-cpp .
          docker build -f sandbox/python.Dockerfile -t visi-sandbox-python .
          docker build -f sandbox/java.Dockerfile -t visi-sandbox-java .
      - name: Isolation tests (Docker)
        run: TRACE_SANDBOX=docker python3 -m unittest pipeline.tests.test_sandbox -v
      - name: Isolation tests (gVisor)
        run: TRACE_SANDBOX=gvisor python3 -m unittest pipeline.tests.test_sandbox -v
      - name: API service tests (real runs under gVisor)
        run: |
          python -m pip install -r backend/requirements.txt
          TRACE_SANDBOX=gvisor python3 -m unittest discover -s backend/tests -t . -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Vite 8 needs Node ^20.19 or >=22.12 (engines in package-lock.json).
      # Node 20 is past end of life, so CI uses 22 LTS.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [schema, cpp-linux, python-adapter, java-adapter, rewriter-linux, sandbox-linux, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to the GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Registry names must be lower case; the owner's name may not be. The
      # source label links each package to this repository.
      - name: Build and push the sandbox images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT="${GITHUB_SHA::12}"
          for lang in cpp python java; do
            IMAGE="ghcr.io/$OWNER/visi-sandbox-$lang"
            docker build -f "sandbox/$lang.Dockerfile" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$IMAGE:latest" -t "$IMAGE:$SHORT" .
            docker push "$IMAGE:latest"
            docker push "$IMAGE:$SHORT"
          done

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [schema, cpp-linux, python-adapter, java-adapter, rewriter-linux, sandbox-linux, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Without the variable the page would call /api on Pages itself, which has
      # no API, so the deploy stops here instead.
      - name: Build with the API's address
        env:
          VITE_API_BASE: ${{ vars.VISI_API_BASE }}
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::error::Set the repository variable VISI_API_BASE to the API's origin (https://...)."
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
