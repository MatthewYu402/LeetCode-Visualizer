<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // The theme before the page draws, so it never flashes the other one: the theme picked
      // before (src/theme.ts, THEME_KEY), else the system's. Storage can be blocked.
      (function () {
        var t = null;
        try { t = localStorage.getItem("lcv-theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!-- The tab icon: the eye, black on a light tab bar and white on a dark one (the SVG switches by
         itself). The PNGs are for browsers without SVG icons, one per browser theme, and the touch
         icon, on the dark tile, is for a phone's home screen (public/). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32-light.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-32-dark.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Visi · Sandbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
